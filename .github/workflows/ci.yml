name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          # Install torch CPU build first (avoids pulling in heavy CUDA wheels on CI)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install the rest, skipping optional heavy extras
          pip install numpy pyyaml scikit-learn pandas pyarrow pytest
          # scapy, pyshark, cesnet-datazoo, wandb, optuna installed only in full env

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
