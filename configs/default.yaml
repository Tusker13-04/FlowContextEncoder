# =============================================================
# FlowContextEncoder — Canonical Hyperparameters
# All other configs inherit from / override these values.
# =============================================================

# ── Model architecture ──────────────────────────────────────
model:
  d_model: 128          # Packet-token embedding dimension
  d_inner: 256          # SSM inner (expanded) dimension  (2× d_model)
  d_ctx: 16             # Network-context vector dimension (RTT, jitter, loss, throughput)
  n_layers: 4           # Number of MambaBlocks
  seq_len: 128          # N — packets per flow (truncate/pad target)
  embed_dim: 128        # Output embedding dimension (L2-normalised)
  d_state: 16           # SSM state dimension
  d_conv: 4             # Causal conv1d kernel width
  dt_rank: 8            # Rank of Delta (Δ) projection
  dropout: 0.1

# ── Training ────────────────────────────────────────────────
train:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 64
  epochs: 100
  warmup_epochs: 5
  grad_clip: 1.0
  seed: 42

# ── Loss ────────────────────────────────────────────────────
loss:
  type: supcon            # supcon | arcface | simclr
  tau: 0.07               # Temperature for SupCon / SimCLR
  arcface_margin: 0.3     # m for ArcFace (used when type=arcface)
  arcface_scale: 32       # s for ArcFace

# ── Data ────────────────────────────────────────────────────
data:
  flow_dir: data/flows
  splits_dir: splits
  num_workers: 4
  pin_memory: true
  coarse_classes:
    - video_streaming
    - gaming
    - voip
    - web
    - xr

# ── Evaluation ──────────────────────────────────────────────
eval:
  knn_k: 5
  eval_every_n_epochs: 5
  save_best_metric: intra_cos_sim   # checkpoint on best intra-class cosine similarity

# ── Logging ─────────────────────────────────────────────────
logging:
  wandb: false            # set true to enable W&B logging
  project: FlowContextEncoder
  log_every_n_steps: 50
